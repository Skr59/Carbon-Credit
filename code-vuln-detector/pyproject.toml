[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-vuln-detector"
version = "1.0.0"
description = "Autonomous code vulnerability detection via fine-tuned CodeBERT + CWE rule engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BTech Final Year Project" }]
keywords = ["security", "vulnerability-detection", "codebert", "static-analysis", "cwe"]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "datasets>=2.17.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.31.0", "requests>=2.31.0", "pygments>=2.17.0"]
xai = ["captum>=0.7.0", "shap>=0.44.0"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "matplotlib>=3.8.0", "seaborn>=0.13.0"]

[project.scripts]
vuln-train = "models.train:main"
vuln-serve = "api.main:run"

[tool.setuptools]
packages = ["config", "data", "models", "explanation", "api", "evaluation", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
